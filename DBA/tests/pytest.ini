[tool:pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    ; Cobertura fidedigna: mede só o código de produção exercitado pelos testes
    ; (antes, --cov=. media os próprios arquivos de teste e inflava a métrica).
    ; Régua atual: expressao_parser ~93%, pdf_parser_final ~16% => total ~48%.
    ; Subir o fail-under conforme o parser de PDF ganhar testes.
    --cov=expressao_parser
    --cov=DBA.parse_pdf.pdf_parser_final
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=45
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests 